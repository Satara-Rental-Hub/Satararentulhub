<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सर्व प्रॉपर्टीज | Satara Rental Hub</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Firebase Configuration File -->
    <script src="firebase-config.js"></script>
    
    <!-- Multi-Language Support File -->
    <script src="lang.js"></script>
    
    <style>
        :root {
            --primary: #FF671F;
            --primary-dark: #E65C00;
            --bg-light: #F4F6F9;
            --text-dark: #2C3E50;
            --text-muted: #7F8C8D;
            --white: #FFFFFF;
            --premium: #8B5CF6;
            --border: #EAECEE;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-light); color: var(--text-dark); padding-bottom: 80px; }

        /* टॉप बार (Header) */
        .top-bar {
            background: var(--primary); color: var(--white); padding: 15px 20px;
            position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .back-btn { color: var(--white); font-size: 20px; text-decoration: none; }
        .page-title { flex: 1; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .page-title img { width: 30px; height: 30px; border-radius: 50%; background: var(--white); padding: 2px; }

        /* भाषा बदलणारे बटण (Top Right) */
        .lang-toggle-btn {
            background: rgba(255,255,255,0.2); color: var(--white); border: 1px solid var(--white);
            padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer;
        }

        /* फिल्टर्स (Search & Dropdowns) */
        .filters-section { background: var(--white); padding: 15px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 60px; z-index: 90; }
        
        .search-box { position: relative; margin-bottom: 12px; }
        .search-box input {
            width: 100%; padding: 12px 15px 12px 40px; background: var(--bg-light);
            border: 1px solid var(--border); border-radius: 12px; font-size: 14px; outline: none;
        }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .filter-row { display: flex; gap: 10px; }
        .filter-select {
            flex: 1; padding: 10px 5px 10px 10px; background: var(--white); border: 1.5px solid var(--border);
            border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--text-dark); outline: none;
            text-overflow: ellipsis; overflow: hidden; white-space: nowrap;
        }

        /* क्विक चिप्स (Categories) */
        .chips-wrapper { padding: 15px 20px 5px 20px; overflow-x: auto; scrollbar-width: none; }
        .chips-wrapper::-webkit-scrollbar { display: none; }
        .chips-container { display: flex; gap: 10px; width: max-content; }
        .chip {
            padding: 8px 16px; background: var(--white); border: 1.5px solid var(--border);
            border-radius: 20px; font-size: 13px; font-weight: 700; color: var(--text-dark);
            text-decoration: none; display: flex; align-items: center; gap: 6px; transition: 0.2s; cursor: pointer;
        }
        .chip.active { background: var(--primary); color: var(--white); border-color: var(--primary); }

        /* प्रॉपर्टी लिस्ट (Cards) */
        .list-container { padding: 15px 20px; }
        .list-count { font-size: 14px; font-weight: 700; color: var(--text-muted); margin-bottom: 15px; display: flex; justify-content: space-between;}

        .property-card {
            background: var(--white); border-radius: 16px; overflow: hidden; margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04); text-decoration: none; display: block; color: inherit;
            border: 1px solid var(--border); position: relative;
        }
        .property-img { height: 180px; background: #EAECEE; position: relative; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #BDC3C7; }
        .property-img img { width: 100%; height: 100%; object-fit: cover; } 
        
        /* प्रीमियम टॅग */
        .badge-premium { position: absolute; top: 12px; left: 12px; background: var(--premium); color: var(--white); font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(139, 92, 246, 0.4); z-index: 2; }
        
        .btn-fav { position: absolute; top: 12px; right: 12px; width: 35px; height: 35px; background: rgba(255,255,255,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 18px; border: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; z-index: 10;}
        .btn-fav.active { color: #E74C3C; }

        .property-info { padding: 15px; }
        .property-title { font-size: 16px; font-weight: 800; margin-bottom: 5px; line-height: 1.3; }
        .property-price { font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
        .property-price small { font-size: 12px; color: var(--text-muted); font-weight: 600; }
        
        .property-meta-row { display: flex; gap: 15px; margin-bottom: 10px; font-size: 13px; color: var(--text-muted); font-weight: 600; }
        .property-meta-row i { color: var(--primary); width: 16px; text-align: center; }
        
        .property-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
        .tag { background: #F1F5F9; color: #475569; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; }

        .loading-state { text-align: center; padding: 40px 20px; color: #94A3B8; font-size: 14px; font-weight: 600; }
        .no-result { text-align: center; padding: 40px 20px; color: #94A3B8; font-size: 15px; font-weight: 600; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; background: var(--white);
            display: flex; justify-content: space-around; padding: 10px 0;
            box-shadow: 0 -2px 15px rgba(0,0,0,0.05); border-top-left-radius: 20px; border-top-right-radius: 20px; z-index: 100;
        }
        .nav-item { text-align: center; color: #94A3B8; font-size: 11px; font-weight: 700; text-decoration: none; flex: 1; }
        .nav-item i { font-size: 22px; margin-bottom: 4px; display: block; transition: 0.3s; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { transform: translateY(-3px); }
        .nav-item.add-btn i {
            background: var(--primary); color: var(--white); width: 45px; height: 45px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            margin: -20px auto 4px auto; box-shadow: 0 4px 10px rgba(255, 103, 31, 0.4); font-size: 20px;
        }
    </style>
</head>
<body>

    <!-- टॉप बार -->
    <div class="top-bar">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="page-title">
            <img src="Logo.png" alt="Logo" onerror="this.style.display='none'">
            <span data-lang="search_props_title">प्रॉपर्टीज शोधा</span>
        </div>
        <button class="lang-toggle-btn" onclick="toggleLanguage()">ENG / मराठी</button>
    </div>

    <!-- फिल्टर्स -->
    <div class="filters-section">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="परिसर, गाव किंवा नाव शोधा..." data-lang-placeholder="search_placeholder" onkeyup="filterProperties()">
        </div>
        <div class="filter-row">
            <!-- साताऱ्याचे सर्व ११ तालुके -->
            <select class="filter-select" id="talukaFilter" onchange="filterProperties()">
                <option value="" data-lang="all_talukas">सर्व तालुके</option>
                <option value="satara">सातारा</option>
                <option value="karad">कराड</option>
                <option value="wai">वाई</option>
                <option value="phaltan">फलटण</option>
                <option value="koregaon">कोरेगाव</option>
                <option value="mahabaleshwar">महाबळेश्वर</option>
                <option value="patan">पाटण</option>
                <option value="man">माण (दहिवडी)</option>
                <option value="khatav">खटाव (वडूज)</option>
                <option value="khandala">खंडाळा</option>
                <option value="jawali">जावळी (मेढा)</option>
            </select>
            
            <!-- प्रॉपर्टीचे सर्व प्रकार -->
            <select class="filter-select" id="typeFilter" onchange="filterProperties()">
                <option value="" data-lang="all_types">सर्व प्रकार</option>
                <option value="1rk">1 RK</option>
                <option value="1bhk">1 BHK</option>
                <option value="2bhk">2 BHK</option>
                <option value="3bhk">3 BHK</option>
                <option value="single-room" data-lang="opt_single">सिंगल रूम</option>
                <option value="cot-basis" data-lang="opt_cot">कॉट बेसिस</option>
                <option value="hostel-pg" data-lang="opt_pg">हॉस्टेल / PG</option>
                <option value="flat" data-lang="opt_flat">फ्लॅट</option>
                <option value="shop" data-lang="opt_shop">गाळा / दुकान</option>
                <option value="corporate-office" data-lang="opt_office">कॉर्पोरेट ऑफिस</option>
                <option value="plot" data-lang="opt_plot">प्लॉट / जागा</option>
                <option value="godown" data-lang="opt_godown">गोडाऊन</option>
            </select>
        </div>
    </div>

    <!-- क्विक चिप्स (Categories) -->
    <div class="chips-wrapper">
        <div class="chips-container" id="categoryChips">
            <div class="chip active" data-val="" onclick="setChipFilter(this)"><i class="fa-solid fa-list"></i> <span data-lang="chip_all">सर्व</span></div>
            <div class="chip" data-val="single-room" onclick="setChipFilter(this)"><i class="fa-solid fa-bed"></i> <span data-lang="opt_single">सिंगल रूम</span></div>
            <div class="chip" data-val="cot-basis" onclick="setChipFilter(this)"><i class="fa-solid fa-bed-pulse"></i> <span data-lang="opt_cot">कॉट बेसिस</span></div>
            <div class="chip" data-val="hostel-pg" onclick="setChipFilter(this)"><i class="fa-solid fa-hotel"></i> <span data-lang="opt_pg">हॉस्टेल/PG</span></div>
            <div class="chip" data-val="flat" onclick="setChipFilter(this)"><i class="fa-solid fa-building"></i> <span data-lang="opt_flat">फ्लॅट</span></div>
            <div class="chip" data-val="shop" onclick="setChipFilter(this)"><i class="fa-solid fa-store"></i> <span data-lang="opt_shop">गाळा</span></div>
            <div class="chip" data-val="corporate-office" onclick="setChipFilter(this)"><i class="fa-solid fa-briefcase"></i> <span data-lang="opt_office">ऑफिस</span></div>
            <div class="chip" data-val="plot" onclick="setChipFilter(this)"><i class="fa-solid fa-map-location-dot"></i> <span data-lang="opt_plot">प्लॉट</span></div>
        </div>
    </div>

    <!-- प्रॉपर्टी लिस्ट -->
    <div class="list-container">
        <div class="list-count">
            <span id="result-count">... प्रॉपर्टीज शोधत आहे</span>
            <select id="sortFilter" style="border: none; background: transparent; font-weight: bold; color: var(--primary); outline: none; cursor: pointer;" onchange="sortProperties()">
                <option value="new">नवीन पहिल्यांदा</option>
                <option value="low">किंमत: कमी ते जास्त</option>
                <option value="high">किंमत: जास्त ते कमी</option>
            </select>
        </div>

        <div id="properties-container">
            <div class="loading-state"><i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; margin-bottom: 10px;"></i><br>प्रॉपर्टीज लोड होत आहेत...</div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span data-lang="nav_home">होम</span>
        </a>
        <a href="saved.html" class="nav-item">
            <i class="fa-regular fa-heart"></i>
            <span data-lang="nav_saved">सेव्हड</span>
        </a>
        <a href="owner_dashboard.html" class="nav-item add-btn">
            <i class="fa-solid fa-plus"></i>
            <span data-lang="nav_add">ॲड</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fa-regular fa-user"></i>
            <span data-lang="nav_profile">प्रोफाईल</span>
        </a>
    </div>

    <!-- JavaScript (Firebase Fetching & Filtering) -->
    <script>
        let allProperties = []; // Firebase मधून आलेला सर्व डेटा इथे सेव्ह होईल
        let filteredProperties = []; // फिल्टर केलेला डेटा

        window.onload = function() {
            if(typeof applySavedLanguage === 'function') {
                applySavedLanguage();
            }
            
            // URL मधील Category किंवा Search Query शोधणे (उदा. index.html वरून क्लिक केल्यास)
            const urlParams = new URLSearchParams(window.location.search);
            const categoryType = urlParams.get('type');
            const searchQuery = urlParams.get('search');

            if(categoryType) {
                document.getElementById('typeFilter').value = categoryType;
                // चिप ऍक्टिव्ह करणे
                let chips = document.querySelectorAll('.chip');
                chips.forEach(c => c.classList.remove('active'));
                let targetChip = document.querySelector(`.chip[data-val="${categoryType}"]`);
                if(targetChip) targetChip.classList.add('active');
            }
            
            if(searchQuery) {
                document.getElementById('searchInput').value = searchQuery;
            }

            fetchPropertiesFromFirebase();
        };

        // १. Firebase मधून सर्व "Live" प्रॉपर्टीज फेच करणे
        function fetchPropertiesFromFirebase() {
            if(typeof db !== 'undefined') {
                // फक्त ज्यांचे status 'live' आहे तेच आणा
                db.collection("properties").where("status", "==", "live").get().then((querySnapshot) => {
                    allProperties = [];
                    querySnapshot.forEach(doc => { 
                        let d = doc.data(); 
                        d.id = doc.id; 
                        allProperties.push(d); 
                    });

                    // सुरुवातीला नवीन आणि प्रीमियम प्रॉपर्टीज वर (Sort by Date & Premium)
                    allProperties.sort((a,b) => {
                        let aIsPremium = (a.planType === 'premium1' || a.planType === 'premium2') ? 1 : 0;
                        let bIsPremium = (b.planType === 'premium1' || b.planType === 'premium2') ? 1 : 0;
                        
                        if(bIsPremium !== aIsPremium) {
                            return bIsPremium - aIsPremium; // प्रीमियम वरती
                        } else {
                            return new Date(b.createdAt) - new Date(a.createdAt); // नंतर नवीन
                        }
                    });
                    
                    filteredProperties = [...allProperties];
                    
                    filterProperties(); // लोड झाल्यावर फिल्टर ॲप्लाय करा

                }).catch((error) => {
                    console.log("Error fetching properties:", error);
                    document.getElementById('properties-container').innerHTML = `<div class="loading-state" style="color:red;">डेटा लोड करताना एरर आला.</div>`;
                });
            } else {
                // डमी डेटा (Firebase नसल्यास)
                document.getElementById('properties-container').innerHTML = `<div class="no-result">लोकल टेस्टिंग मोड चालू आहे.</div>`;
            }
        }

        // २. चिप फिल्टर लॉजिक
        function setChipFilter(element) {
            let chips = document.querySelectorAll('.chip');
            chips.forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            
            document.getElementById('typeFilter').value = element.getAttribute('data-val');
            filterProperties();
        }

        // ३. प्रॉपर्टी फिल्टर करणे आणि दाखवणे
        function filterProperties() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const selectedTaluka = document.getElementById('talukaFilter').value.toLowerCase();
            const selectedType = document.getElementById('typeFilter').value.toLowerCase();

            filteredProperties = allProperties.filter(prop => {
                // मॅचिंग कंडिशन्स
                let matchSearch = prop.title.toLowerCase().includes(searchTerm) || prop.area.toLowerCase().includes(searchTerm) || prop.taluka.toLowerCase().includes(searchTerm);
                let matchTaluka = selectedTaluka === "" || (prop.taluka && prop.taluka.toLowerCase() === selectedTaluka);
                let matchType = selectedType === "" || (prop.type && prop.type.toLowerCase() === selectedType);

                return matchSearch && matchTaluka && matchType;
            });

            sortProperties(); // फिल्टर झाल्यावर सॉर्टिंग अप्लाय करून रेंडर करा
        }

        // ४. किमतीनुसार सॉर्ट करणे (Low to High / High to Low)
        function sortProperties() {
            let sortValue = document.getElementById('sortFilter').value;

            if(sortValue === 'low') {
                filteredProperties.sort((a,b) => a.rent - b.rent);
            } else if(sortValue === 'high') {
                filteredProperties.sort((a,b) => b.rent - a.rent);
            } else {
                // Default: Premium First, then New
                filteredProperties.sort((a,b) => {
                    let aIsPremium = (a.planType === 'premium1' || a.planType === 'premium2') ? 1 : 0;
                    let bIsPremium = (b.planType === 'premium1' || b.planType === 'premium2') ? 1 : 0;
                    if(bIsPremium !== aIsPremium) return bIsPremium - aIsPremium;
                    return new Date(b.createdAt) - new Date(a.createdAt);
                });
            }

            renderProperties();
        }

        // ५. UI वर कार्ड्स दाखवणे
        function renderProperties() {
            const container = document.getElementById('properties-container');
            const countDisplay = document.getElementById('result-count');
            
            container.innerHTML = '';

            if(filteredProperties.length === 0) {
                container.innerHTML = `<div class="no-result">
                    <i class="fa-solid fa-search" style="font-size: 30px; color: #CBD5E1; margin-bottom: 10px;"></i><br>
                    तुम्ही शोधत असलेली प्रॉपर्टी सध्या उपलब्ध नाही.
                </div>`;
                countDisplay.innerText = `0 प्रॉपर्टीज`;
                return;
            }

            filteredProperties.forEach(prop => {
                let imgHtml = (prop.photoUrls && prop.photoUrls.length > 0) 
                    ? `<img src="${prop.photoUrls[0]}" alt="${prop.title}">` 
                    : `<i class="fa-regular fa-image"></i>`;

                // Premium Badge Logic (जर युझरने premium1 किंवा premium2 प्लॅन घेतला असेल)
                let badgeHtml = (prop.planType === 'premium1' || prop.planType === 'premium2')
                    ? `<div class="badge-premium"><i class="fa-solid fa-crown"></i> Premium</div>` 
                    : ``;

                let propHtml = `
                <a href="details.html?id=${prop.id}" class="property-card">
                    <div class="property-img">
                        ${imgHtml}
                        ${badgeHtml}
                        <button class="btn-fav" onclick="event.preventDefault(); this.classList.toggle('active'); saveProperty('${prop.id}')"><i class="fa-solid fa-heart"></i></button>
                    </div>
                    <div class="property-info">
                        <div class="property-title">${prop.title}</div>
                        <div class="property-price">₹ ${prop.rent} <small>/ महिना</small></div>
                        <div class="property-meta-row">
                            <span><i class="fa-solid fa-location-dot"></i> ${prop.area}, ${prop.taluka}</span>
                        </div>
                        <div class="property-tags">
                            <span class="tag">${prop.type}</span>
                        </div>
                    </div>
                </a>`;
                
                container.innerHTML += propHtml;
            });

            countDisplay.innerText = `${filteredProperties.length} प्रॉपर्टीज सापडल्या`;
        }

        // Save Property Logic (Wishlist)
        function saveProperty(id) {
            console.log("Property saved to wishlist:", id);
            // इथे तुम्ही Local Storage किंवा Firebase मध्ये wishlist अपडेट करू शकता.
            alert("प्रॉपर्टी सेव्ह केली!");
        }
    </script>
</body>
</html>
